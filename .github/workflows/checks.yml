name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Windows because this targets net10.0-windows, which follows from WinPenKit targeting it.
    runs-on: windows-latest

    steps:
      # recursive, because WinPenKit is a submodule of this repository rather than a package
      # or a sibling checkout. That is what lets this kit be cloned and built on its own,
      # which is the property that makes it a kit rather than a folder.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build
        run: dotnet build StrokeKit.slnx -c Release

      # Two suites now. StrokeKit.Tests is arithmetic and files -- the trace format's column
      # handling, the batch clock, the contracts a live stroke is built under -- and opens no
      # window. StrokeKit.Lab.Tests does: it runs real windows on Avalonia's headless platform
      # and compares captured frames against the surfaces they came from.
      #
      # They are on different xunit versions, v2 and v3, because Avalonia.Headless.XUnit
      # depends on v3. One `dotnet test` over the solution runs both.
      - name: Test
        run: dotnet test StrokeKit.slnx -c Release --no-build

      # The same guarantees checked against the application as a built program rather than
      # against the library from a test. No window is opened: the presenter draws into a
      # raster surface standing in for a display, so what a reader would see is read back and
      # counted. Came here with the lab from StrokeFieldGuide.
      - name: Self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter StrokeKit.Lab.exe app/*/bin/Release |
                 Select-Object -First 1
          if (-not $exe) { throw "StrokeKit.Lab.exe not found" }

          # Start-Process -Wait rather than the call operator: this is a GUI subsystem
          # binary, so PowerShell does not wait for it and $LASTEXITCODE comes back empty,
          # which would make this step pass whatever the checks reported.
          $out = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--selftest' `
                                -Wait -PassThru -RedirectStandardOutput $out
          if (Test-Path $out) { Get-Content $out }
          if ($proc.ExitCode -ne 0) { throw "self-test failed with exit code $($proc.ExitCode)" }

  # The pin is deliberate -- see the README -- but a pin that is never checked against the
  # thing it pins is how a kit quietly stops compiling against its own dependency's future.
  # This job says so early, and is allowed to fail without failing the build.
  against-winpenkit-main:
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Take WinPenKit's main instead of the pin
        run: git -C vendor/WinPenKit fetch origin main --depth 1 && git -C vendor/WinPenKit checkout FETCH_HEAD

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build
        run: dotnet build StrokeKit.slnx -c Release
